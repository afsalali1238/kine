name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Guards the committed 3D body assets. This check exists because broken
      # placeholder GLBs shipped once; it must run on every PR, not by hand.
      - name: 3D asset checks
        run: npm run check:assets

      # 136/136 exercise illustrations must keep solving to valid poses.
      - name: Illustration checks
        run: npm run check:illustrations

      - name: Production build
        run: npm run build
